<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "UTIL WEB" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
   /* ===== Layout ===== */
.wrap{ max-width:980px; }

.panel{
  margin-top:14px;
  padding:16px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.05);
  box-shadow:0 18px 60px rgba(0,0,0,0.25);
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
  flex-wrap:wrap;
}
.head h1{ margin:0; font-size:22px; }
.mini{ font-size:12px; opacity:0.7; }

.controls{
  margin-top:12px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.04);
}
.controls-left,.controls-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

/* ===== Inputs ===== */
.select{
  min-width:190px;
  height:44px;
  padding:0 44px 0 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.06);
  color:#fff;
  font-weight:900;
  font-size:14px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  background-image:
    linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.85) 50%),
    linear-gradient(135deg, rgba(255,255,255,0.85) 50%, transparent 50%),
    linear-gradient(to right, rgba(255,255,255,0.10), rgba(255,255,255,0.10));
  background-position:
    calc(100% - 20px) 50%,
    calc(100% - 14px) 50%,
    calc(100% - 40px) 50%;
  background-size:6px 6px, 6px 6px, 1px 22px;
  background-repeat:no-repeat;
}
.select option{ background:#fff; color:#000; }

.btn2{
  height:44px;
  padding:0 18px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.06);
  color:inherit;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}
.btn2.ghost{ background:rgba(255,255,255,0.04); }
.btn2.primary{
  background:linear-gradient(135deg, rgba(46,204,113,0.35), rgba(46,204,113,0.18));
  border-color:rgba(46,204,113,0.6);
  box-shadow:0 6px 18px rgba(46,204,113,0.25);
}
.btn2:active{ transform:scale(0.99); }
.btn2[disabled]{ opacity:0.5; cursor:not-allowed; }

/* ===== KPI ===== */
.kpis{
  margin-top:12px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
}
.kpi{
  padding:10px 12px;
  min-width:0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.04);
}
.kpi .t{ font-size:12px; opacity:0.85; white-space:nowrap; }
.kpi .v{
  margin-top:6px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;              /* ... 대신 글자 축소로 */
  font-size:clamp(12px, 3.6vw, 18px);
}

/* ===== Badge (UP/DOWN/CORRECT) ===== */
.kpi .v.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  font-weight:900;
  letter-spacing:0.5px;
  transition:all 0.2s ease;
  font-size:clamp(12px, 3.2vw, 14px);
  padding:clamp(4px, 1.2vw, 6px) clamp(8px, 2.4vw, 12px);
}
.badge.up{
  background:linear-gradient(135deg, rgba(255,80,80,0.85), rgba(180,0,0,0.8));
  color:#fff;
  box-shadow:0 6px 18px rgba(255,0,0,0.35);
}
.badge.down{
  background:linear-gradient(135deg, rgba(80,160,255,0.9), rgba(0,80,200,0.8));
  color:#fff;
  box-shadow:0 6px 18px rgba(0,120,255,0.35);
}
.badge.correct{
  background:linear-gradient(135deg, rgba(46,204,113,0.9), rgba(0,150,80,0.85));
  color:#fff;
  box-shadow:0 6px 18px rgba(46,204,113,0.4);
}

/* ===== Arena ===== */
.arena{
  margin-top:14px;
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.04);
}

.inputbox{ display:flex; justify-content:center; margin-top:10px; }
.screen{
  width:100%;
  max-width:460px;
  height:56px;
  padding:0 12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(0,0,0,0.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:900;
  letter-spacing:0.5px;
  overflow:hidden;
}
.screen.muted{ color:rgba(255,255,255,0.45); font-weight:800; }

.pad{
  margin-top:12px;
  display:grid;
  justify-content:center;
  gap:10px;
  grid-template-columns:repeat(3, 72px);
}
.num-btn{
  width:72px;
  height:72px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.05);
  box-shadow:0 18px 60px rgba(0,0,0,0.25);
  cursor:pointer;
  font-size:22px;
  font-weight:900;
  color:rgba(255,255,255,0.92);
  user-select:none;
}
.num-btn:active{ transform:scale(0.99); }
.num-btn.util{
  font-size:16px;
  background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.82);
}

.status{
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-size:13px;
  opacity:0.85;
}

.history{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.10);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(0,0,0,0.12);
  font-size:13px;
}
.row .l{ opacity:0.75; }
.row .r{ font-weight:900; }

/* ===== Header ===== */
.header{
  position:relative;
  width:100%;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg, rgba(11,16,32,0.85), rgba(11,16,32,0.35));
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.header-inner{
  max-width:1160px;
  margin:0 auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

/* ===== Submit (키패드 폭 중앙) ===== */
.submit-wrap{
  display:flex;
  justify-content:center;
  margin-top:14px;
}
.submit-wrap .btn2{
  width:100%;
  max-width:236px; /* 72*3 + gap*2 */
  height:56px;
  font-size:16px;
  border-radius:16px;
}

/* ===== Responsive ===== */
@media (max-width: 640px){
  .controls{ flex-direction:column; align-items:stretch; }
  .controls-left,.controls-right{ width:100%; justify-content:space-between; }
  .select{ width:100%; min-width:0; }
  .btn2{ width:100%; }
}
/* ✅ 모바일: KPI는 3칸 한 줄 유지, 카드 내부는 2줄(라벨/값) */
@media (max-width: 520px){
  .kpis{
    grid-template-columns: 2fr 1fr 1fr;
    gap: 8px;
  }

  /* KPI 카드 안은 다시 세로(2줄)로 */
  .kpi{
    display:block;
    padding: 10px 10px;
  }

  .kpi .t{
    font-size: 11px;
    opacity: 0.8;
    white-space: nowrap;     /* 라벨은 1줄 유지 */
    overflow: hidden;
    text-overflow: ellipsis; /* 라벨이 너무 길면 ... */
  }

  /* 값은 2줄까지 허용해서 "짤림" 방지 */
  .kpi .v{
    margin-top: 6px;
    font-size: 14px;         /* 기본값보다 살짝 작게 */
    font-weight: 900;
    white-space: normal;     /* ✅ 줄바꿈 허용 */
    overflow: visible;       /* ✅ 잘리지 않게 */
    text-overflow: clip;
    line-height: 1.1;
    word-break: keep-all;
  }

  /* 상태 배지(DOWN/UP)는 줄바꿈 하지 말고 크기만 줄이기 */
  .kpi .v.badge{
    white-space: nowrap;
    font-size: 12px;
    padding: 4px 8px;
  }
}


@media (max-width: 380px){
  .pad{ grid-template-columns:repeat(3, clamp(54px, 19vw, 64px)); }
  .num-btn{ height:clamp(54px, 19vw, 64px); font-size:18px; }
}

  </style>
</head>

<body>
  <header class="header">

    <div class="header-inner">
      <a class="brand" href="/">
        <div class="logo"></div>
        <div class="brand-title">
          <b>UTIL WEB</b>
          <span>Mini games</span>
        </div>
      </a>
      <div class="nav">
        <a class="btn small" href="/">Home</a>
      </div>
    
  </header>

  <div class="wrap">
    <section class="panel">
      <div class="head">
        <div>
          <h1>업앤다운</h1>
          <div class="mini">버튼으로 숫자를 입력하고, 최소 횟수로 맞추세요.</div>
        </div>
        
      </div>

      <div class="controls">
        <div class="controls-left">
          <select class="select" id="level">
            <option value="100">난이도: 100 (1~100)</option>
            <option value="1000">난이도: 1000 (1~1000)</option>
            <option value="10000">난이도: 10000 (1~10000)</option>
            <option value="100000">난이도: 100000 (1~100000)</option>
          </select>
          <button class="btn2 ghost" id="newGameBtn">새 게임</button>
        </div>
   
      </div>

<div class="kpis">
  <div class="kpi kpi-range">
    <div class="t">현재 범위</div>
    <div class="v" id="kRange">1 ~ 100</div>
  </div>

  <div class="kpi">
    <div class="t">시도 횟수</div>
    <div class="v" id="kTries">0</div>
  </div>

  <div class="kpi">
    <div class="t">상태</div>
    <div class="v" id="kHint">-</div>
  </div>
</div>



      <div class="arena">
        <div class="inputbox">
          <div class="screen muted" id="screen">숫자 입력</div>
        </div>

        <div class="pad" id="pad"></div>
     
<div class="submit-wrap">
  <button class="btn2 primary" id="submitBtn">확인</button>
</div>


        <div class="status">
          <div id="statusLeft">난이도를 선택하고 시작하세요.</div>
          <div id="statusRight">-</div>
        </div>

        <div class="history" id="history"></div>

        <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.10);padding-top:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <h3 style="margin:0;font-size:15px;">전체 랭킹 (난이도별 · 시도 적은순)</h3>
            <button type="button" id="changeNickBtn"
              style="height:30px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);color:inherit;font-size:12px;font-weight:700;cursor:pointer;">
              닉네임 변경
            </button>
          </div>
          <div id="globalRank" style="margin-top:10px;"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/leaderboard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/updown_game.js') }}"></script>
</body>
</html>
