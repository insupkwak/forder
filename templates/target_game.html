<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "UTIL WEB" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    /* =========================
   Target Shot : Clean CSS (Final)
========================= */

/* layout */
.wrap{ max-width: 980px; }

.panel{
  margin-top: 14px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 18px 60px rgba(0,0,0,0.25);
  padding: 16px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap: 10px;
  flex-wrap:wrap;
}
.head h1{ margin:0; font-size: 22px; }
.mini{ opacity:0.7; font-size: 12px; }

/* header (sticky 제거) */
.header{
  position: relative;
  width: 100%;
  backdrop-filter: blur(14px);
  background: linear-gradient(180deg, rgba(11,16,32,0.85), rgba(11,16,32,0.35));
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.header-inner{
  max-width: 1160px;
  margin: 0 auto;
  padding: 14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 12px;
}

/* =========================
   Controls : 3 rows
   1) speed   (- box +)
   2) angle   (- box +)
   3) fire/reset
========================= */

.controls{
  margin-top: 12px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);

  display:flex;
  flex-direction: column;
  gap: 10px;
}

.controls-left{
  display:flex;
  flex-direction: column;
  gap: 10px;
}

.ctrl-group{
  display:flex;
  align-items:center;
  gap: 10px;
  width: 100%;
}

.ctrl-btn{
  width: 60px;
  height: 52px;
  flex: 0 0 60px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: inherit;
  font-weight: 900;
  font-size: 20px;
  cursor: pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}
.ctrl-btn:active{ transform: scale(0.97); }
.ctrl-btn[disabled]{ opacity:0.5; cursor:not-allowed; }

.ctrl-box{
  flex: 1 1 auto;
  min-width: 0;
  height: 52px;
  padding: 8px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);

  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.ctrl-box .t{
  font-size: 11px;
  opacity: 0.8;
  line-height: 1.1;
}
.ctrl-box .v{
  margin-top: 4px;
  font-size: 20px;
  font-weight: 900;
  line-height: 1.15;
}

.controls-right{
  display:flex;
  gap: 10px;
  width: 100%;
}

.btn{
  height: 52px;
  flex: 1 1 0;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: inherit;
  font-weight: 900;
  font-size: 15px;
  cursor: pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  white-space: nowrap;
}
.btn.primary{
  background: linear-gradient(135deg, rgba(46,204,113,0.35), rgba(46,204,113,0.18));
  border-color: rgba(46,204,113,0.6);
  box-shadow: 0 6px 18px rgba(46,204,113,0.25);
}
.btn.ghost{ background: rgba(255,255,255,0.04); }
.btn:active{ transform: scale(0.99); }
.btn[disabled]{ opacity:0.5; cursor:not-allowed; }

/* mobile tweak */
@media (max-width: 640px){
  .ctrl-btn{ width: 64px; flex: 0 0 64px; height: 52px; }
  .ctrl-box .v{ font-size: 18px; }
  .btn{ font-size: 14px; }
}

/* =========================
   Arena / Canvas / Status
========================= */

.arena{
  margin-top: 14px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);
  padding: 14px;
}

.canvas-wrap{
  width: 100%;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(0,0,0,0.12);
  overflow:hidden;
}
canvas{
  display:block;
  width: 100%;
  height: auto;
}

.status{
  margin-top: 12px;
  display:flex;
  justify-content:space-between;
  gap: 10px;
  flex-wrap:wrap;
  align-items:center;
  font-size: 13px;
  opacity: 0.85;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 0.3px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
}
.badge.good{
  background: rgba(46,204,113,0.16);
  border-color: rgba(46,204,113,0.38);
}
.badge.bad{
  background: rgba(231,76,60,0.14);
  border-color: rgba(231,76,60,0.35);
}

/* =========================
   KPI : always 3 columns + center text
========================= */

.kpis{
  margin-top: 12px;
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
}

.kpi{
  min-width: 0;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);
  padding: 10px 12px;

  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.kpi .t{
  font-size: 12px;
  opacity: 0.85;
  width: 100%;
  text-align:center;
  line-height: 1.1;
}

.kpi .v{
  margin-top: 6px;
  font-size: 16px;
  font-weight: 800;
  width: 100%;
  text-align:center;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 640px){
  .kpis{ gap: 8px; }
  .kpi{ padding: 9px 10px; }
  .kpi .t{ font-size: 11px; }
  .kpi .v{ font-size: 14px; }
}

/* =========================
   Score Table
========================= */

.score-board{
  margin-top: 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);
  padding: 12px;
}
.score-title{
  font-weight: 800;
  margin-bottom: 8px;
  opacity: 0.85;
}

.score-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.score-table th,
.score-table td{
  padding: 6px 8px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.score-table th{
  font-weight: 700;
  opacity: 0.8;
}

/* top 3 rank highlight (순위 컬럼이 첫번째일 때) */
.score-table tbody tr:nth-child(1) td:first-child{ color: gold; font-weight: 900; }
.score-table tbody tr:nth-child(2) td:first-child{ color: silver; font-weight: 900; }
.score-table tbody tr:nth-child(3) td:first-child{ color: #cd7f32; font-weight: 900; }

@media (max-width: 640px){

  .canvas-wrap{
    aspect-ratio: 900 / 1040;   /* 기존 900x520 → 2배 높이 */
  }

  canvas{
    height: 100% !important;
  }
}



  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">
        <div class="logo"></div>
        <div class="brand-title">
          <b>UTIL WEB</b>
          <span>Mini games</span>
        </div>
      </a>
      <div class="nav">
        <a class="btn small" href="/">Home</a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="panel">
      <div class="head">
        <div>
          <h1>타겟 맞추기</h1>
          <div class="mini">속도/각도를 조절하고 발사하세요. 10회 평균 거리가 기록입니다.</div>
        </div>
        <div class="mini" id="bestText">Best Avg: -</div>
      </div>

      <div class="controls">
  <div class="controls-left">
    <!-- 속도 한 줄 -->
    <div class="ctrl-group">
      <button class="ctrl-btn" id="speedDown">-</button>

      <div class="ctrl-box">
        <div class="t">속도</div>
        <div class="v"><span id="speedText">50</span></div>
      </div>

      <button class="ctrl-btn" id="speedUp">+</button>
    </div>

    <!-- 각도 한 줄 -->
    <div class="ctrl-group">
      <button class="ctrl-btn" id="angleDown">-</button>

      <div class="ctrl-box">
        <div class="t">각도</div>
        <div class="v"><span id="angleText">45</span>°</div>
      </div>

      <button class="ctrl-btn" id="angleUp">+</button>
    </div>
  </div>

  <div class="controls-right">
    <button class="btn primary" id="fireBtn">발사</button>
    <button class="btn ghost" id="resetBtn">리셋</button>
  </div>
</div>


     

      <div class="arena">
        <div class="canvas-wrap">
          <canvas id="cv" width="900" height="520"></canvas>
        </div>

        

        <div class="status">
          <div id="statusLeft">타겟은 매 라운드 랜덤 위치입니다.</div>
          <div id="statusRight"><span class="badge" id="resultBadge">READY</span></div>
        </div>

 <div class="kpis">
        <div class="kpi range">
          <div class="t">라운드</div>
          <div class="v" id="kRound">1 / 10</div>
        </div>
<div class="kpi">
  <div class="t">콤보 상태</div>
  <div class="v" id="kLast">x1</div>
</div>
<div class="kpi">
  <div class="t">점수</div>
  <div class="v" id="kAvg">0 점</div>
</div>

      </div>
<div class="score-board">
  <div class="score-title">내 기록 TOP 10 (이 브라우저)</div>
  <table class="score-table">
    <thead>
<tr>
  <th>순위</th>
  <th>날짜시간</th>
  <th>점수</th>
</tr>

    </thead>
    <tbody id="scoreTableBody">
    </tbody>
  </table>
</div>

<div class="score-board" style="margin-top:14px;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;">
    <div class="score-title" style="margin:0;">전체 랭킹 (점수 높은순)</div>
    <button type="button" id="changeNickBtn"
      style="height:30px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);color:inherit;font-size:12px;font-weight:700;cursor:pointer;">
      닉네임 변경
    </button>
  </div>
  <div id="globalRank"></div>
</div>

      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/leaderboard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/target_shot.js') }}"></script>
</body>
</html>
